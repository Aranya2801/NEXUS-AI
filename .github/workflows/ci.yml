name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
      - run: pip install -r backend/requirements-dev.txt
      # SQLite tests + real PostgreSQL/pgvector (bundled server): Alembic migrations and the backup/restore drill, S3 (moto), Redis (real redis-server),
      # plus the static validators' own tests (Kubernetes, workflows, Terraform, release tooling)
      - run: python -m pytest -q -p no:logging
        working-directory: backend
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python infrastructure/scripts/validate_k8s.py
      - run: python infrastructure/scripts/validate_workflows.py
      - run: python infrastructure/scripts/validate_terraform.py
      # version consistency, single alembic head, migration expand/contract lint, OpenAPI freshness
      - run: python infrastructure/scripts/release.py check
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, static-checks, frontend]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: NEXUS_JWT_SECRET=ci-placeholder docker compose config -q
      - run: docker compose build
        env: { NEXUS_JWT_SECRET: ci-placeholder }
