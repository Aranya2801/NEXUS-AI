# Run BEFORE rolling out a new API/worker version:
#   kubectl -n nexus delete job nexus-migrate --ignore-not-found && kubectl apply -k deploy/k8s/migrate && kubectl -n nexus wait --for=condition=complete job/nexus-migrate --timeout=300s
# Migrations are additive/expand-first so the previous version keeps working while this runs (see docs/releases.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrate, app.kubernetes.io/component: migrate}
    spec:
      restartPolicy: Never
      serviceAccountName: nexus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: registry.example.com/nexus/api:0.1.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: nexus-config}
            - secretRef: {name: nexus-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
