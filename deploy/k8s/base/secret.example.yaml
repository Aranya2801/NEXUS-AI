# TEMPLATE ONLY – never commit real values. Create the real Secret with e.g.:
#   kubectl -n nexus create secret generic nexus-secrets --from-env-file=prod.secrets.env
# or manage it with External Secrets / Sealed Secrets / SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
type: Opaque
stringData:
  NEXUS_JWT_SECRET: "CHANGE_ME_at_least_32_random_characters"
  NEXUS_DATABASE_URL: "CHANGE_ME_postgresql+asyncpg://user:password@host:5432/nexus"
  NEXUS_REDIS_URL: "CHANGE_ME_redis://:password@host:6379/0"
  NEXUS_S3_ENDPOINT: "CHANGE_ME_https://s3.example.com"
  NEXUS_S3_ACCESS_KEY: "CHANGE_ME"
  NEXUS_S3_SECRET_KEY: "CHANGE_ME"
  NEXUS_LLM_API_KEY: "CHANGE_ME_or_leave_empty_for_mock"
