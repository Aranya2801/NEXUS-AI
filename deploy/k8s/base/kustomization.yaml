# Apply with: kubectl apply -k deploy/k8s/overlays/<your-overlay>   (base alone also works once images/hosts are set)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nexus
labels:
  - pairs:
      app.kubernetes.io/part-of: nexus-ai
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - api.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
# secret.example.yaml is intentionally NOT listed: create the real `nexus-secrets` Secret out of band (see docs/deployment-kubernetes.md).
images:
  - name: registry.example.com/nexus/api
    newTag: "0.1.0"
  - name: registry.example.com/nexus/frontend
    newTag: "0.1.0"
