apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"       # NEXUS_MAX_UPLOAD_MB (25) + multipart overhead
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"    # long research runs / SSE
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [nexus.example.com]
      secretName: nexus-tls                                  # create with cert-manager or your PKI
  rules:
    - host: nexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {name: http}}
